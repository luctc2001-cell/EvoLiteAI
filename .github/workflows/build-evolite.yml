name: Build EvoLiteAI

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt

      - name: Download model weights
        run: |
          New-Item -ItemType Directory -Force -Path weights | Out-Null
          Invoke-WebRequest -Uri "https://github.com/TencentARC/GFPGAN/releases/download/v1.3.4/GFPGANv1.4.pth" -OutFile "weights/GFPGANv1.4.pth"
          Invoke-WebRequest -Uri "https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.1/RealESRGAN_x2plus.pth" -OutFile "weights/RealESRGAN_x2plus.pth"

      - name: Build app with PyInstaller
        run: pyinstaller --noconfirm --clean --onedir --windowed --name EvoLiteAI --icon=icon.ico --add-data "weights;weights" --collect-all mediapipe --collect-all gfpgan --collect-all realesrgan --collect-all basicsr --collect-all rawpy --hidden-import=tifffile --hidden-import=cv2 EvoLiteAI.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: EvoLiteAI-Portable
          path: dist/EvoLiteAI/

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: EvoLiteAI-Setup
          path: installer_output/*.exe
